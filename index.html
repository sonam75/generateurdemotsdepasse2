<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de mots de passe</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <header class="card-header">
      <div class="header-text">
        <span class="brand">EDEN School</span>
        <h1>Générateur de<br>mots de passe</h1>
      </div>
      <div class="icon-badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#111111">
          <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" transform="rotate(-45 12 12)"/>
        </svg>
      </div>
    </header>

    <section class="card-body">
      <div class="label-row">
        <span class="label-title">Mot de passe</span>
        <span class="label-info">16 caractères</span>
      </div>

      <div class="password-box">
        <span class="password-placeholder">En attente du clic</span>
        <button type="button" class="btn-copy">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6C5CE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          Copier
        </button>
      </div>

      <button type="button" class="btn-generate">
        Générer un mot de passe
      </button>
    </section>
  </main>

</body>
</html>
