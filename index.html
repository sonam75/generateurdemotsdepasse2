<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de mots de passe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <header class="card-header">
      <div class="header-text">
        <span class="brand">EDEN School</span>
        <h1>Générateur de<br>mots de passe</h1>
      </div>
     <div class="icon-badge"><img src="assets/cle.svg" alt="icone cle"></div>
    </header>

    <section class="card-body">
      <div class="label-row">
        <span class="label-title">Mot de passe</span>
        <span class="label-info">16 caractères</span>
      </div>

      <div class="password-box">
        <span class="password-placeholder">En attente du clic</span>
          <button type="button" class="btn-copy">
          <img src="assets/copie.svg" alt="icone copier">
          <span>Copier</span>
          
        </button>
        </button>
      </div>

      <button type="button" class="btn-generate">
        Générer un mot de passe
      </button>
    </section>
  </main>

</body>
</html>
